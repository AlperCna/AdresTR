[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adrestr-client"
version = "0.1.0"
description = "Python client for the AdresTR REST API: Turkish address parsing, normalization, matching and validation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Alper Can" }]
keywords = ["turkish", "address", "adres", "geocoding", "parser", "nlp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/AlperCna/AdresTR"
Documentation = "https://alpercna.github.io/AdresTR/"

[tool.hatch.build.targets.wheel]
packages = ["src/adrestr_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
