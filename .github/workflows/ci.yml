name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            invariant: "false"
          - name: windows
            os: windows-latest
            invariant: "false"
          # ADR-0002: the library must behave identically without ICU (chiseled images, WASM, AOT).
          - name: linux-invariant-globalization
            os: ubuntu-latest
            invariant: "true"
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${{ matrix.invariant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore AdresTR.slnx
      - run: dotnet build AdresTR.slnx -c Release --no-restore
      - name: Gazetteer is up to date with data/staging
        run: dotnet run --project tools/AdresTR.DataBuilder -c Release --no-build -- check

      - run: dotnet test --solution AdresTR.slnx -c Release --no-build --coverage --coverage-output-format cobertura --results-directory ${{ github.workspace }}/coverage

      - name: Upload coverage
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**/*.cobertura.xml

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet pack src/AdresTR/AdresTR.csproj -c Release -o ./artifacts
      - run: dotnet pack src/AdresTR.Data/AdresTR.Data.csproj -c Release -o ./artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*
