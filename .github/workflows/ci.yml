name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            invariant: "false"
          - name: windows
            os: windows-latest
            invariant: "false"
          # ADR-0002: the library must behave identically without ICU (chiseled images, WASM, AOT).
          - name: linux-invariant-globalization
            os: ubuntu-latest
            invariant: "true"
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: ${{ matrix.invariant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore AdresTR.slnx
      - run: dotnet build AdresTR.slnx -c Release --no-restore
      - name: Gazetteer is up to date with data/staging
        run: dotnet run --project tools/AdresTR.DataBuilder -c Release --no-build -- check

      - name: Evaluation sets are valid
        run: dotnet run --project tools/AdresTR.Eval -c Release --no-build -- validate

      - name: Accuracy gate (dev sets)
        run: dotnet run --project tools/AdresTR.Eval -c Release --no-build -- gate

      - run: dotnet test --solution AdresTR.slnx -c Release --no-build --coverage --coverage-output-format cobertura --results-directory ${{ github.workspace }}/coverage

      - name: Upload coverage
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**/*.cobertura.xml

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet pack src/AdresTR/AdresTR.csproj -c Release -o ./artifacts
      - run: dotnet pack src/AdresTR.Data/AdresTR.Data.csproj -c Release -o ./artifacts
      - run: dotnet pack src/AdresTR.AspNetCore/AdresTR.AspNetCore.csproj -c Release -o ./artifacts
      - run: dotnet pack src/AdresTR.FluentValidation/AdresTR.FluentValidation.csproj -c Release -o ./artifacts
      - run: dotnet pack src/AdresTR.Streets/AdresTR.Streets.csproj -c Release -o ./artifacts
      - name: API container image builds
        run: dotnet publish src/AdresTR.Api/AdresTR.Api.csproj -c Release -t:PublishContainer -p:ContainerRuntimeIdentifiers=linux-x64 -p:ContainerArchiveOutputPath=${{ runner.temp }}/adrestr-api.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python client
        working-directory: clients/python
        run: |
          pip install -e ".[test]"
          pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: TypeScript client
        working-directory: clients/typescript
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
